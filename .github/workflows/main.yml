name: Build Padavan K2P TRX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc6:i386 libstdc++6:i386 jq

      - name: Clone Padavan Source & Toolchain
        run: |
          GH="https://github.com"
          REPO=$(curl -s "https://github.com" | jq -r '.items[] | select(.size > 40000) | .full_name' | head -n 1)
          [ -z "$REPO" ] || [ "$REPO" = "null" ] && REPO="hanwckf/rt-n56u"
          git clone --depth=1 "$GH/$REPO.git" "$GITHUB_WORKSPACE/rt-n56u"
          cd "$GITHUB_WORKSPACE/rt-n56u/toolchain-mipsel"
          ./dl_toolchain.sh

      - name: Apply Your Custom K2P Config
        run: |
          cat << 'EOF' > "$GITHUB_WORKSPACE/rt-n56u/trunk/configs/templates/K2P.config"
          CONFIG_VENDOR=Ralink
          CONFIG_PRODUCT=MT7621
          CONFIG_FIRMWARE_PRODUCT_ID="K2P"
          CONFIG_FIRMWARE_INCLUDE_SFE=y
          CONFIG_LINUXDIR=linux-3.4.x
          CONFIG_FIRMWARE_WIFI_DRIVER=5.0.4.0
          CONFIG_FIRMWARE_KERNEL_CONFIG="kernel-3.4.x-5.0.config"
          CONFIG_FIRMWARE_ENABLE_IPV6=y
          CONFIG_FIRMWARE_ENABLE_USB=n
          CONFIG_FIRMWARE_ENABLE_UFSD=n
          CONFIG_FIRMWARE_ENABLE_FAT=n
          CONFIG_FIRMWARE_ENABLE_EXFAT=n
          CONFIG_FIRMWARE_ENABLE_EXT2=n
          CONFIG_FIRMWARE_ENABLE_EXT3=n
          CONFIG_FIRMWARE_ENABLE_EXT4=n
          CONFIG_FIRMWARE_ENABLE_XFS=n
          CONFIG_FIRMWARE_ENABLE_FUSE=n
          CONFIG_FIRMWARE_ENABLE_SWAP=n
          CONFIG_FIRMWARE_INCLUDE_UVC=n
          CONFIG_FIRMWARE_INCLUDE_HID=n
          CONFIG_FIRMWARE_INCLUDE_SERIAL=n
          CONFIG_FIRMWARE_INCLUDE_AUDIO=n
          CONFIG_FIRMWARE_INCLUDE_XFRM=n
          CONFIG_FIRMWARE_INCLUDE_QOS=n
          CONFIG_FIRMWARE_INCLUDE_IMQ=n
          CONFIG_FIRMWARE_INCLUDE_IFB=n
          CONFIG_FIRMWARE_INCLUDE_IPSET=y
          CONFIG_FIRMWARE_INCLUDE_NFSD=n
          CONFIG_FIRMWARE_INCLUDE_NFSC=n
          CONFIG_FIRMWARE_INCLUDE_CIFS=n
          CONFIG_FIRMWARE_INCLUDE_LANG_CN=y
          CONFIG_FIRMWARE_INCLUDE_NTFS_3G=n
          CONFIG_FIRMWARE_INCLUDE_LPRD=n
          CONFIG_FIRMWARE_INCLUDE_U2EC=n
          CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y
          CONFIG_FIRMWARE_INCLUDE_HDPARM=n
          CONFIG_FIRMWARE_INCLUDE_PARTED=n
          CONFIG_FIRMWARE_INCLUDE_SMBD=n
          CONFIG_FIRMWARE_INCLUDE_SMBD36=y
          CONFIG_FIRMWARE_INCLUDE_WINS=n
          CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG=n
          CONFIG_FIRMWARE_INCLUDE_FTPD=n
          CONFIG_FIRMWARE_INCLUDE_RPL2TP=n
          CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=y
          CONFIG_FIRMWARE_INCLUDE_HTTPS=n
          CONFIG_FIRMWARE_INCLUDE_SFTP=y
          CONFIG_FIRMWARE_INCLUDE_DROPBEAR=n
          CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE=n
          CONFIG_FIRMWARE_INCLUDE_OPENSSH=y
          CONFIG_FIRMWARE_INCLUDE_OPENVPN=y
          CONFIG_FIRMWARE_INCLUDE_SSWAN=n
          CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y
          CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y
          CONFIG_FIRMWARE_INCLUDE_XUPNPD=n
          CONFIG_FIRMWARE_INCLUDE_MINIDLNA=n
          CONFIG_FIRMWARE_INCLUDE_FIREFLY=n
          CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=y
          CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=n
          CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL=n
          CONFIG_FIRMWARE_INCLUDE_ARIA=n
          CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=n
          CONFIG_FIRMWARE_INCLUDE_CURL=y
          CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y
          CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n
          CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM=n
          CONFIG_FIRMWARE_INCLUDE_DOGCOM=n
          CONFIG_FIRMWARE_INCLUDE_MINIEAP=n
          CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=n
          CONFIG_FIRMWARE_INCLUDE_NAPT66=y
          CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=n
          CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=n
          CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=n
          CONFIG_FIRMWARE_INCLUDE_VLMCSD=n
          CONFIG_FIRMWARE_INCLUDE_TTYD=y
          CONFIG_FIRMWARE_INCLUDE_LRZSZ=n
          CONFIG_FIRMWARE_INCLUDE_HTOP=y
          CONFIG_FIRMWARE_INCLUDE_NANO=y
          CONFIG_FIRMWARE_INCLUDE_IPERF3=y
          CONFIG_FIRMWARE_INCLUDE_DUMP1090=n
          CONFIG_FIRMWARE_INCLUDE_RTL_SDR=n
          CONFIG_FIRMWARE_INCLUDE_MTR=y
          CONFIG_FIRMWARE_INCLUDE_SOCAT=y
          CONFIG_FIRMWARE_INCLUDE_SRELAY=y
          CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n
          CONFIG_FIRMWARE_INCLUDE_FRPC=n
          CONFIG_FIRMWARE_INCLUDE_FRPS=n
          CONFIG_FIRMWARE_INCLUDE_TUNSAFE=n
          CONFIG_FIRMWARE_INCLUDE_WIREGUARD=n
          EOF
          cp -f "$GITHUB_WORKSPACE/rt-n56u/trunk/configs/templates/K2P.config" "$GITHUB_WORKSPACE/rt-n56u/trunk/.config"

      - name: Inject Universal & ProtonVPN Importer into vpncli.asp
        run: |
          VPN_FILE=$(find "$GITHUB_WORKSPACE/rt-n56u/trunk/user/www" -name "vpncli.asp" | head -n 1)
          cat << 'EOF' > /tmp/ovpn_ui.html
          <div style="background:#f5f5f5;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:4px;">
            <b>Import OpenVPN Profile (.ovpn - ProtonVPN / Modern / Legacy): </b>
            <input type="file" accept=".ovpn,.conf" onchange="importOVPN(this)">
            <div id="ov_msg" style="color:green;font-weight:bold;margin-top:6px;"></div>
          </div>
          <script>
          function importOVPN(el) {
            var f = el.files[0];
            if (!f) return;
            var r = new FileReader();
            r.onload = function(e) {
              var t = e.target.result.replace(/\r\n/g, "\n");
              function tag(n) {
                var m = t.match(new RegExp("<" + n + ">([\\s\\S]*?)<\\/" + n + ">", "i"));
                return (m && m[1]) ? m[1].trim() : "";
              }
              var ca = tag("ca"), crt = tag("cert"), key = tag("key");
              var tls = tag("tls-auth") || tag("tls-crypt") || tag("tls-crypt-v2");
              var crypt = /<tls-crypt/i.test(t);
              var needUserPass = /^auth-user-pass/im.test(t);
              var isProton = /protonvpn/i.test(t) || /proton/i.test(f.name);

              var ls = t.replace(/<(ca|cert|key|tls-auth|tls-crypt|tls-crypt-v2|extra-certs|crl-verify)>[\s\S]*?<\/\1>/gi, "").split("\n");
              var ex = [], h = "", p = "1194", pr = "0", comp = "0";

              for (var i = 0; i < ls.length; i++) {
                var l = ls[i].trim();
                if (!l || l.startsWith("#") || l.startsWith(";")) continue;
                if (/^(block-outside-dns|setenv|explicit-exit-notify|windows-driver|register-dns|auth-user-pass|client|dev\s|ca\s|cert\s|key\s|tls-auth\s|tls-crypt\s|up\s|down\s|script-security)/i.test(l)) continue;

                if (/^remote\s+/i.test(l)) {
                  var a = l.split(/\s+/);
                  if (!h && a[1]) h = a[1];
                  if (a[2]) p = a[2];
                  if (a[3] && /tcp/i.test(a[3])) pr = "1";
                } else if (/^proto\s+/i.test(l)) {
                  pr = /tcp/i.test(l) ? "1" : "0";
                } else if (/^comp-lzo/i.test(l)) {
                  comp = /no/i.test(l) ? "0" : "2";
                } else if (/^compress/i.test(l)) {
                  comp = /lz4/i.test(l) ? "3" : "1";
                } else if (/^data-ciphers\s+/i.test(l)) {
                  var c = l.replace(/^data-ciphers\s+/i, "").trim();
                  ex.push("ncp-ciphers " + c);
                  var firstC = c.split(":")[0];
                  if (firstC) ex.push("cipher " + firstC);
                } else if (!/^data-ciphers-fallback/i.test(l)) {
                  ex.push(l);
                }
              }

              if (!ex.some(function(x){ return /^auth-nocache/i.test(x); })) ex.push("auth-nocache");

              var fm = document.form;
              if (fm.vpnc_enable[0]) fm.vpnc_enable[0].checked = true;
              else fm.vpnc_enable.checked = true;
              change_vpnc_enabled();

              fm.vpnc_type.value = "2";
              change_vpnc_type();

              fm.vpnc_peer.value = h;
              fm.vpnc_ov_port.value = p;
              fm.vpnc_ov_prot.value = pr;
              if (fm.vpnc_ov_compress) fm.vpnc_ov_compress.value = comp;
              if (fm.vpnc_ov_auth) {
                fm.vpnc_ov_auth.value = (needUserPass && !crt) ? "1" : "0";
                change_vpnc_ov_auth();
              }
              fm.vpnc_ov_atls.value = tls ? (crypt ? "2" : "1") : "0";
              change_vpnc_ov_atls();

              fm["ovpncli.ca.crt"].value = ca;
              fm["ovpncli.client.crt"].value = crt;
              fm["ovpncli.client.key"].value = key;
              fm["ovpncli.ta.key"].value = tls;
              fm["ovpncli.client.conf"].value = ex.join("\n");

              var note = "Loaded: " + h + ":" + p;
              if (isProton) note += " [ProtonVPN Detected: Enter OpenVPN Credentials below & click Apply]";
              else if (needUserPass) note += " [Enter Username & Password below & click Apply]";
              else note += " [Ready! Click Apply]";
              document.getElementById("ov_msg").innerText = note;
            };
            r.readAsText(f);
          }
          </script>
          EOF

          awk '/<form method="post" name="form"/{system("cat /tmp/ovpn_ui.html")}1' "$VPN_FILE" > /tmp/vpncli_new.asp
          mv -f /tmp/vpncli_new.asp "$VPN_FILE"

      - name: Build TRX Firmware
