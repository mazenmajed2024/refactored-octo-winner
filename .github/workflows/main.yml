name: Build Padavan K2P TRX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot kmod cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc6:i386 libstdc++6:i386 jq

      - name: Clone Padavan and Toolchain
        run: |
          GH="https://github.com"
          REPO=$(curl -s "https://github.com" | jq -r '.items[] | select(.size > 40000) | .full_name' | head -n 1)
          [ -z "$REPO" ] || [ "$REPO" = "null" ] && REPO="hanwckf/rt-n56u"
          git clone --depth=1 "$GH/$REPO.git" "$GITHUB_WORKSPACE/rt-n56u"
          cd "$GITHUB_WORKSPACE/rt-n56u/toolchain-mipsel"
          ./dl_toolchain.sh

      - name: Configure K2P OpenVPN
        run: |
          cd "$GITHUB_WORKSPACE/rt-n56u/trunk"
          K2P_CFG=$(find configs/templates -iname "*K2P*.config" | head -n 1)
          cp -f "$K2P_CFG" .config
          sed -i 's/#CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/g' .config
          grep -q "CONFIG_FIRMWARE_INCLUDE_OPENVPN=y" .config || echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=y" >> .config
          grep -q "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" .config || echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" >> .config
          grep -q "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" .config || echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" >> .config

      - name: Inject Universal OVPN UI
        run: |
          VPN_FILE=$(find "$GITHUB_WORKSPACE/rt-n56u/trunk/user/www" -name "vpncli.asp" | head -n 1)
          echo '' | base64 -d > /tmp/ovpn_ui.html
          awk '/<form method="post" name="form"/{system("cat /tmp/ovpn_ui.html")}1' "$VPN_FILE" > /tmp/vpncli_new.asp
          mv -f /tmp/vpncli_new.asp "$VPN_FILE"

      - name: Build TRX Firmware
        run: |
          cd "$GITHUB_WORKSPACE/rt-n56u/trunk"
          ./clear_tree
          ./build_firmware_modify K2P

      - name: Upload TRX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: K2P-Padavan-TRX
          path: ${{ github.workspace }}/rt-n56u/trunk/images/*.trx
